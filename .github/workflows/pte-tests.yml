name: PTE regression tests
on:
  push:
    branches: [main]
    paths:
      - 'server/**'
      - 'client/speaking-audio.js'
      - '.github/workflows/pte-tests.yml'
  workflow_dispatch:
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Run read-only question bank and scoring tests
        run: node --test server/*.test.js
