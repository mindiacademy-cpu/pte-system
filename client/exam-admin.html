<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTE Exam Admin</title>
  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      color: #111827;
      padding: 30px;
    }

    .container {
      max-width: 1100px;
      margin: 0 auto;
    }

    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 24px;
    }

    .grid {
      display: grid;
      grid-template-columns: 1.1fr 0.9fr;
      gap: 24px;
      align-items: start;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0,0,0,0.08);
      padding: 22px;
      margin-bottom: 24px;
    }

    .card h2 {
      margin: 0 0 16px 0;
      color: #1f3c88;
      font-size: 22px;
    }

    label {
      display: block;
      margin-bottom: 6px;
      font-weight: bold;
      color: #1f3c88;
      font-size: 14px;
    }

    input[type="text"],
    select {
      width: 100%;
      padding: 11px 12px;
      border: 1px solid #d1d5db;
      border-radius: 10px;
      font-size: 14px;
      outline: none;
      background: white;
    }

    input[type="text"]:focus,
    select:focus {
      border-color: #2563eb;
      box-shadow: 0 0 0 3px rgba(37,99,235,0.12);
    }

    .toolbar {
      display: grid;
      grid-template-columns: 1.2fr 0.8fr;
      gap: 12px;
      margin-bottom: 14px;
    }

    .toolbar-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 14px;
    }

    .left-actions,
    .right-actions {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      align-items: center;
    }

    .question-list {
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      overflow: hidden;
      max-height: 520px;
      overflow-y: auto;
      background: #fff;
    }

    .q-item {
      display: grid;
      grid-template-columns: 28px 90px 1fr 70px;
      gap: 10px;
      align-items: center;
      padding: 11px 12px;
      border-bottom: 1px solid #f1f5f9;
      font-size: 14px;
      cursor: pointer;
      background: white;
    }

    .q-item:last-child {
      border-bottom: none;
    }

    .q-item:hover {
      background: #f8fafc;
    }

    .q-item input[type="checkbox"] {
      width: 16px;
      height: 16px;
      margin: 0;
      cursor: pointer;
    }

    .q-type {
      font-size: 12px;
      font-weight: bold;
      color: #1f4db8;
      text-transform: uppercase;
      letter-spacing: 0.3px;
    }

    .q-title {
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      color: #111827;
    }

    .q-time {
      font-size: 12px;
      color: #6b7280;
      text-align: right;
      white-space: nowrap;
    }

    .muted {
      font-size: 13px;
      color: #6b7280;
    }

    .empty {
      padding: 18px;
      text-align: center;
      color: #6b7280;
    }

    .btn {
      border: none;
      border-radius: 10px;
      padding: 11px 16px;
      font-size: 14px;
      font-weight: bold;
      cursor: pointer;
      color: white;
      background: #2563eb;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-secondary {
      background: #4b5563;
    }

    .btn-secondary:hover {
      background: #374151;
    }

    .btn-success {
      background: #059669;
    }

    .btn-success:hover {
      background: #047857;
    }

    .btn-danger {
      background: #dc2626;
    }

    .btn-danger:hover {
      background: #b91c1c;
    }

    .result-box {
      margin-top: 16px;
      padding: 14px;
      border-radius: 12px;
      background: #eff6ff;
      border: 1px solid #bfdbfe;
      color: #1e3a8a;
      font-weight: bold;
      line-height: 1.7;
    }

    .exam-list {
      display: grid;
      gap: 14px;
    }

    .exam-item {
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      padding: 16px;
      background: #fafafa;
    }

    .exam-head {
      display: flex;
      justify-content: space-between;
      gap: 12px;
      flex-wrap: wrap;
      align-items: start;
    }

    .exam-title {
      font-weight: bold;
      font-size: 18px;
      color: #111827;
      margin-bottom: 6px;
    }

    .exam-meta {
      color: #6b7280;
      font-size: 13px;
      line-height: 1.7;
    }

    .pill {
      display: inline-block;
      padding: 6px 10px;
      border-radius: 999px;
      background: #1f3c88;
      color: white;
      font-size: 12px;
      font-weight: bold;
    }

    .section-divider {
      height: 1px;
      background: #e5e7eb;
      margin: 18px 0;
    }

    @media (max-width: 980px) {
      .grid {
        grid-template-columns: 1fr;
      }

      .toolbar {
        grid-template-columns: 1fr;
      }
    }

    @media (max-width: 640px) {
      .q-item {
        grid-template-columns: 28px 70px 1fr 52px;
        font-size: 13px;
      }
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>PTE Exam Admin Panel</h1>

    <div class="grid">
      <div class="card">
        <h2>Yeni Sınav Oluştur</h2>

        <label for="examTitle">Sınav Başlığı</label>
        <input id="examTitle" type="text" placeholder="Örn: PTE Practice Set 1">

        <div class="section-divider"></div>

        <div class="toolbar">
          <div>
            <label for="searchBox">Soru Ara</label>
            <input id="searchBox" type="text" placeholder="Başlığa veya tipe göre ara..." oninput="renderQuestionSelectionList()">
          </div>

          <div>
            <label for="typeFilter">Tipe Göre Filtrele</label>
            <select id="typeFilter" onchange="renderQuestionSelectionList()">
              <option value="all">Tümü</option>
              <option value="speaking">Speaking</option>
              <option value="writing">Writing</option>
              <option value="reading">Reading</option>
              <option value="listening">Listening</option>
            </select>
          </div>
        </div>

        <div class="toolbar-actions">
          <div class="left-actions">
            <button class="btn btn-secondary" onclick="selectAllVisible()">Görünenleri Seç</button>
            <button class="btn btn-secondary" onclick="clearSelections()">Seçimi Temizle</button>
          </div>

          <div class="right-actions muted">
            <span id="questionCountInfo">0 soru</span>
            <span>•</span>
            <span id="selectedCountInfo">0 seçili</span>
          </div>
        </div>

        <div id="questionSelectionList" class="question-list"></div>

        <button class="btn btn-success" style="margin-top:16px;" onclick="createExam()">Sınav Oluştur</button>

        <div id="examCreateResult"></div>
      </div>

      <div>
        <div class="card">
          <h2>Oluşturulmuş Sınavlar</h2>
          <div id="examList" class="exam-list"></div>
        </div>
      </div>
    </div>
  </div>

  <script>
    let questions = [];
    let exams = [];
    let selectedQuestionIds = new Set();

    function updateSelectedCount() {
      document.getElementById("selectedCountInfo").innerText = `${selectedQuestionIds.size} seçili`;
    }

    function getFilteredQuestions() {
      const searchValue = document.getElementById("searchBox").value.trim().toLowerCase();
      const typeFilter = document.getElementById("typeFilter").value;

      return questions.filter((q) => {
        const matchesType = typeFilter === "all" ? true : q.type === typeFilter;
        const text = `${q.title || ""} ${q.type || ""} ${q.prompt || ""}`.toLowerCase();
        const matchesSearch = searchValue ? text.includes(searchValue) : true;
        return matchesType && matchesSearch;
      });
    }

    function renderQuestionSelectionList() {
      const container = document.getElementById("questionSelectionList");
      const filteredQuestions = getFilteredQuestions();

      document.getElementById("questionCountInfo").innerText = `${filteredQuestions.length} soru`;

      if (!filteredQuestions.length) {
        container.innerHTML = `<div class="empty">Eşleşen soru bulunamadı.</div>`;
        updateSelectedCount();
        return;
      }

      container.innerHTML = "";

      filteredQuestions.forEach((q) => {
        const row = document.createElement("label");
        row.className = "q-item";

        const checked = selectedQuestionIds.has(Number(q.id)) ? "checked" : "";

        row.innerHTML = `
          <input type="checkbox" class="question-check" value="${q.id}" ${checked}>
          <span class="q-type">${q.type || "-"}</span>
          <span class="q-title" title="${(q.title || "").replace(/"/g, "&quot;")}">${q.title || "-"}</span>
          <span class="q-time">${q.type === "speaking" ? `P:${q.prepareTime || 0}s / R:${q.recordTime || 40}s` : `${q.time || 60}s`}</span>
        `;

        const checkbox = row.querySelector(".question-check");

        checkbox.addEventListener("change", (e) => {
          const id = Number(e.target.value);

          if (e.target.checked) {
            selectedQuestionIds.add(id);
          } else {
            selectedQuestionIds.delete(id);
          }

          updateSelectedCount();
        });

        container.appendChild(row);
      });

      updateSelectedCount();
    }

    function selectAllVisible() {
      const filteredQuestions = getFilteredQuestions();
      filteredQuestions.forEach((q) => selectedQuestionIds.add(Number(q.id)));
      renderQuestionSelectionList();
    }

    function clearSelections() {
      selectedQuestionIds.clear();
      renderQuestionSelectionList();
    }

    async function createExam() {
      const title = document.getElementById("examTitle").value.trim();
      const questionIds = [...selectedQuestionIds];

      if (!title) {
        alert("Sınav başlığı gerekli.");
        return;
      }

      if (!questionIds.length) {
        alert("En az 1 soru seç.");
        return;
      }

      const selectedQuestions = questions.filter(q => questionIds.includes(Number(q.id)));

      try {
        const response = await fetch("/create-exam", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            title,
            questions: selectedQuestions
          })
        });

        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Sınav oluşturulamadı.");
          return;
        }

        document.getElementById("examCreateResult").innerHTML = `
          <div class="result-box">
            Sınav oluşturuldu.<br>
            Exam Code: ${data.examCode || "-"}
          </div>
        `;

        document.getElementById("examTitle").value = "";
        selectedQuestionIds.clear();
        renderQuestionSelectionList();
        await loadExams();
      } catch (error) {
        alert("Server bağlantı hatası");
        console.error(error);
      }
    }

    async function deleteExam(id) {
      const ok = confirm("Bu sınavı silmek istiyor musunuz?");
      if (!ok) return;

      try {
        const response = await fetch(`/exams/${id}`, {
          method: "DELETE"
        });

        if (!response.ok) {
          const data = await response.json().catch(() => ({}));
          alert(data.error || "Sınav silinemedi.");
          return;
        }

        await loadExams();
      } catch (error) {
        alert("Server bağlantı hatası");
        console.error(error);
      }
    }

    function renderExamList() {
      const container = document.getElementById("examList");

      if (!exams.length) {
        container.innerHTML = `<div class="empty">Henüz sınav yok.</div>`;
        return;
      }

      container.innerHTML = "";

      exams.slice().reverse().forEach((exam) => {
        const div = document.createElement("div");
        div.className = "exam-item";

        div.innerHTML = `
          <div class="exam-head">
            <div>
              <div class="pill">${exam.examCode || "-"}</div>
              <div class="exam-title" style="margin-top:10px;">${exam.title || "-"}</div>
              <div class="exam-meta">
                Soru Sayısı: ${(exam.questions || []).length}<br>
                Oluşturulma: ${exam.createdAt || "-"}
              </div>
            </div>

            <div>
              <button class="btn btn-danger" onclick="deleteExam(${exam.id})">Sınavı Sil</button>
            </div>
          </div>
        `;

        container.appendChild(div);
      });
    }

    async function loadQuestions() {
      try {
        const response = await fetch("/questions");
        const data = await response.json();

        if (!response.ok) {
          alert(data.error || "Sorular yüklenemedi.");
          questions = [];
          renderQuestionSelectionList();
          return;
        }

        questions = Array.isArray(data) ? data : [];
        renderQuestionSelectionList();
      } catch (error) {
        alert("Sorular yüklenemedi.");
        console.error(error);
        questions = [];
        renderQuestionSelectionList();
      }
    }

    async function loadExams() {
      try {
        const response = await fetch("/exams");
        const data = await response.json();

        if (!response.ok) {
          exams = [];
          renderExamList();
          return;
        }

        exams = Array.isArray(data) ? data : [];
        renderExamList();
      } catch (error) {
        exams = [];
        renderExamList();
        console.error(error);
      }
    }

    async function loadAll() {
      await loadQuestions();
      await loadExams();
    }

    loadAll();
  </script>
</body>
</html>
