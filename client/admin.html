<!DOCTYPE html>
<html lang="tr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>PTE Admin Panel</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f9;
      margin: 0;
      padding: 30px;
      color: #111827;
    }

    h1 {
      text-align: center;
      color: #1f3c88;
      margin-bottom: 24px;
    }

    .topbar {
      text-align: center;
      margin-bottom: 24px;
    }

    .btn {
      background: #2563eb;
      color: white;
      border: none;
      padding: 10px 18px;
      border-radius: 8px;
      cursor: pointer;
      font-size: 15px;
      text-decoration: none;
      display: inline-block;
      margin-right: 8px;
      margin-top: 8px;
    }

    .btn:hover {
      background: #1d4ed8;
    }

    .btn-download {
      background: #059669;
    }

    .btn-download:hover {
      background: #047857;
    }

    .btn-pdf {
      background: #dc2626;
    }

    .btn-pdf:hover {
      background: #b91c1c;
    }

    .btn-delete {
      background: #7c3aed;
    }

    .btn-delete:hover {
      background: #6d28d9;
    }

    .card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.08);
      padding: 24px;
      margin: 20px auto;
      max-width: 1000px;
    }

    .card-header {
      display: flex;
      justify-content: space-between;
      align-items: start;
      gap: 16px;
      flex-wrap: wrap;
      margin-bottom: 18px;
    }

    .candidate-title {
      margin: 0;
      color: #1f3c88;
      font-size: 24px;
    }

    .meta-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(220px, 1fr));
      gap: 14px;
      margin-top: 18px;
      align-items: start;
    }

    .meta-item {
      background: #f8fafc;
      border: 1px solid #e5e7eb;
      border-radius: 12px;
      padding: 12px 14px;
      min-height: auto;
    }

    .label {
      font-weight: bold;
      color: #1f3c88;
      margin-bottom: 8px;
      font-size: 14px;
    }

    .meta-value {
      white-space: pre-wrap;
      word-break: break-word;
      font-size: 15px;
    }

    .score-box {
      margin-top: 18px;
      padding: 18px;
      border-radius: 14px;
      background: linear-gradient(135deg, #eff6ff, #dbeafe);
      border: 1px solid #bfdbfe;
    }

    .score-main {
      font-size: 22px;
      font-weight: bold;
      color: #1e3a8a;
      margin-bottom: 8px;
    }

    .score-sub {
      color: #374151;
      font-size: 15px;
    }

    .section-title {
      margin-top: 26px;
      margin-bottom: 12px;
      font-size: 20px;
      color: #111827;
      text-align: left;
    }

    .question-review-toggle {
      width: 100%;
      text-align: left;
      background: #f8fafc;
      color: #1f3c88;
      border: 1px solid #dbe3ef;
      border-radius: 10px;
      padding: 13px 15px;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
    }

    .question-review-toggle:hover {
      background: #eef4ff;
    }

    .question-review-content {
      margin-top: 8px;
    }

    .question {
      margin-top: 16px;
      padding: 18px;
      border: 1px solid #e5e7eb;
      border-radius: 14px;
      background: #fcfcfd;
      text-align: left;
    }

    .question-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-bottom: 10px;
    }

    .question-type {
      display: inline-block;
      background: #1f3c88;
      color: white;
      padding: 6px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: bold;
      text-transform: uppercase;
    }

    .question-score {
      font-weight: bold;
      color: #059669;
    }

    .question-block {
      margin-top: 10px;
    }

    .question-block pre {
      background: #f8fafc;
      padding: 12px;
      border-radius: 10px;
      white-space: pre-wrap;
      word-wrap: break-word;
      margin: 6px 0 0 0;
      border: 1px solid #e5e7eb;
    }

    audio {
      width: 100%;
      margin-top: 10px;
    }

    .empty {
      text-align: center;
      color: #666;
      padding: 30px;
    }

    .download-wrap {
      margin-top: 10px;
    }

    @media print {
      body {
        background: white;
        padding: 0;
      }

      .topbar,
      .btn,
      .download-wrap,
      audio {
        display: none !important;
      }

      .card {
        box-shadow: none;
        border: 1px solid #ddd;
        margin: 0;
        max-width: 100%;
        page-break-inside: avoid;
      }
    }
  </style>

  <h1>PTE Admin Panel</h1>

  <div class="topbar">
    <button class="btn" onclick="loadResults()">Refresh Results</button>

    <input id="searchInput" type="text" placeholder="İsim veya Exam Code ara"
      style="padding:10px 14px; border:1px solid #ccc; border-radius:8px; width:260px; margin-left:8px;">

    <select id="sortSelect" style="padding:10px 14px; border:1px solid #ccc; border-radius:8px; margin-left:8px;">
      <option value="newest">En yeni</option>
      <option value="oldest">En eski</option>
      <option value="name_asc">İsim A-Z</option>
      <option value="name_desc">İsim Z-A</option>
    </select>
  </div>

  <div id="results"></div>

  <script>
    function getAudioExtensionFromDataUrl(dataUrl) {
      if (!dataUrl || typeof dataUrl !== "string") return "webm";
      if (dataUrl.includes("audio/webm")) return "webm";
      if (dataUrl.includes("audio/wav")) return "wav";
      if (dataUrl.includes("audio/mp4")) return "m4a";
      if (dataUrl.includes("audio/mpeg")) return "mp3";
      return "webm";
    }

    function getCandidateDisplayName(exam) {
      return String(exam?.candidateName || "").trim();
    }

    function getCandidateDisplaySurname(exam) {
      return String(exam?.candidateSurname || "").trim();
    }

    function createDownloadName(exam, answer, answerIndex) {
      const candidate = [getCandidateDisplayName(exam), getCandidateDisplaySurname(exam)].filter(Boolean).join("_").replace(/\s+/g, "_") || "candidate";
      const examCode = exam.examCode || "exam";
      const qTitle = (answer.title || ("speaking_" + (answerIndex + 1))).replace(/[^\w\-]+/g, "_");
      const ext = getAudioExtensionFromDataUrl(answer.speakingAudio);
      return `${candidate}_${examCode}_${qTitle}.${ext}`;
    }


    function escapeHtml(value) {
      return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;");
    }

    function formatTaskName(subType) {
      const labels = {
        read_aloud:"Read Aloud", repeat_sentence:"Repeat Sentence", describe_image:"Describe Image",
        re_tell_lecture:"Re-tell Lecture", answer_short_question:"Answer Short Question",
        summarize_group_discussion:"Summarize Group Discussion", respond_to_a_situation:"Respond to a Situation",
        summarize_written_text:"Summarize Written Text", essay:"Write Essay",
        reading_writing_fill_blanks:"Fill in the Blanks (Dropdown)", reading_mcq_multiple:"Multiple Choice, Multiple Answers",
        reorder_paragraphs:"Reorder Paragraphs", reading_fill_blanks:"Fill in the Blanks (Drag and Drop)",
        reading_mcq_single:"Multiple Choice, Single Answer", summarize_spoken_text:"Summarize Spoken Text",
        listening_mcq_multiple:"Multiple Choice, Multiple Answers", listening_fill_blanks:"Fill in the Blanks (Type In)",
        highlight_correct_summary:"Highlight Correct Summary", listening_mcq_single:"Multiple Choice, Single Answer",
        select_missing_word:"Select Missing Word", highlight_incorrect_words:"Highlight Incorrect Words",
        write_from_dictation:"Write From Dictation"
      };
      return labels[subType] || subType || "-";
    }

    function formatTraitName(key) {
      const labels = {
        content:"Content", pronunciation:"Pronunciation", oralFluency:"Oral Fluency",
        form:"Form", grammar:"Grammar", vocabulary:"Vocabulary", vocabularyRange:"Vocabulary Range",
        spelling:"Spelling", developmentStructureCoherence:"Development, Structure & Coherence",
        generalLinguisticRange:"General Linguistic Range"
      };
      return labels[key] || key;
    }

    function buildTraitHtml(answer) {
      const d = answer && answer.aiDetails;
      if (!d) return "";
      const traits = d.traits && typeof d.traits === "object"
        ? d.traits
        : { content:d.content, pronunciation:d.pronunciation, oralFluency:d.oralFluency };
      const rows = Object.entries(traits).filter(([,v]) => v !== undefined);
      if (!rows.length) return "";
      const rendered = rows.map(([k,v]) => `${formatTraitName(k)}: ${v === null ? "Not assessed" : v}`).join("\n");
      const note = d.scoringNote ? `\n${d.scoringNote}` : "";
      return `<div class="question-block"><div class="label">Practice Scoring Traits</div><pre>${rendered}${d.wordCount != null ? `\nWord Count: ${d.wordCount}` : ""}${note}</pre></div>`;
    }

    function formatFinishedAt(value) {
      if (!value) return "-";

      const date = new Date(value);

      return date.toLocaleString("tr-TR", {
        timeZone: "Europe/Istanbul",
        day: "2-digit",
        month: "2-digit",
        year: "numeric",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function formatExamDate(value) {
      if (!value) return "-";
      return new Date(value).toLocaleDateString("tr-TR", {
        timeZone: "Europe/Istanbul",
        day: "2-digit",
        month: "2-digit",
        year: "numeric"
      });
    }

    function formatExamTime(value) {
      if (!value) return "-";
      return new Date(value).toLocaleTimeString("tr-TR", {
        timeZone: "Europe/Istanbul",
        hour: "2-digit",
        minute: "2-digit",
        second: "2-digit"
      });
    }

    function formatPeriod(start, end) {
      const date = formatExamDate(start || end);
      return `${date} · ${formatExamTime(start)} – ${formatExamTime(end)} · ${getDuration(start, end)}`;
    }

    function getDuration(start, end) {
      if (!start || !end) return "-";

      const diff = new Date(end) - new Date(start);
      if (diff < 0 || Number.isNaN(diff)) return "-";

      const minutes = Math.floor(diff / 60000);
      const seconds = Math.floor((diff % 60000) / 1000);

      return `${minutes}m ${seconds}s`;
    }
    function buildFallbackEvaluation(summary = {}) {
      const speaking = Number(summary.speaking ?? 0);
      const writing = Number(summary.writing ?? 0);
      const reading = Number(summary.reading ?? 0);
      const listening = Number(summary.listening ?? 0);
      const overall = Number(summary.overall ?? 0);

      function getLevel(score) {
        if (score >= 70) return "GÜÇLÜ ALAN";
        if (score >= 55) return "İYİ";
        if (score >= 40) return "GELİŞTİRİLMELİ";
        return "ÖNCELİKLİ GELİŞTİRİLMELİ";
      }

      function getEvaluation(skill, score) {
        if (score >= 70) {
          return `${skill} performansı güçlü düzeydedir. Aday bu alanda istikrarlı bir performans göstermektedir. Mevcut seviyenin korunması için düzenli soru tipi pratiğine devam edilmesi önerilir.`;
        }

        if (score >= 55) {
          return `${skill} performansı genel olarak iyi düzeydedir. Bununla birlikte daha yüksek bir toplam skor için bu alandaki hata oranının azaltılması ve soru tipi bazlı çalışmaların sürdürülmesi faydalı olacaktır.`;
        }

        if (score >= 40) {
          return `${skill} performansı geliştirilebilir düzeydedir. Adayın bu beceride düzenli ve hedefli çalışmaya ihtiyaç duyduğu görülmektedir. Özellikle düşük puan alınan soru türlerine odaklanılması önerilir.`;
        }

        return `${skill} performansı öncelikli geliştirilmesi gereken alanlardan biridir. Bu beceriye yönelik temel eksiklerin belirlenmesi, soru tipi stratejilerinin çalışılması ve düzenli uygulama yapılması önerilir.`;
      }

      const skills = [
        { skill: "Speaking", score: speaking },
        { skill: "Writing", score: writing },
        { skill: "Reading", score: reading },
        { skill: "Listening", score: listening }
      ];

      const priorities = [...skills]
        .sort((a, b) => a.score - b.score)
        .map((item, index) => ({
          rank: index + 1,
          skill: item.skill,
          score: item.score,
          recommendation:
            index === 0
              ? `${item.skill} alanı çalışma planında ilk öncelik olmalıdır.`
              : `${item.skill} alanında düzenli soru tipi çalışması yapılmalıdır.`
        }));

      const strongest = [...skills].sort((a, b) => b.score - a.score)[0];
      const weakest = [...skills].sort((a, b) => a.score - b.score)[0];

      return {
        generalEvaluation:
          `Adayın genel PTE Academic practice test skoru ${overall}'dır. ` +
          `En güçlü performans ${strongest.skill} (${strongest.score}), ` +
          `en fazla gelişim gerektiren alan ise ${weakest.skill} (${weakest.score}) olarak görülmektedir. ` +
          `Çalışma programının düşük skorlu becerilere öncelik verecek şekilde planlanması ve güçlü alanlarda mevcut seviyenin korunması önerilir.`,

        speaking: {
          score: speaking,
          level: getLevel(speaking),
          evaluation: getEvaluation("Speaking", speaking)
        },

        writing: {
          score: writing,
          level: getLevel(writing),
          evaluation: getEvaluation("Writing", writing)
        },

        reading: {
          score: reading,
          level: getLevel(reading),
          evaluation: getEvaluation("Reading", reading)
        },

        listening: {
          score: listening,
          level: getLevel(listening),
          evaluation: getEvaluation("Listening", listening)
        },

        priorities,

        conclusion:
          `Adayın performansının geliştirilmesi için öncelikle ${weakest.skill} alanına odaklanılması, ardından diğer düşük skorlu becerilerin sistematik olarak güçlendirilmesi önerilir.`
      };
    }

    function buildPdfHtml(exam) {
      const summary = exam.summary || {};
      const answers = Array.isArray(exam.answers) ? exam.answers : [];
      const evaluation =
        exam.evaluation &&
          typeof exam.evaluation === "object" &&
          exam.evaluation.generalEvaluation
          ? exam.evaluation
          : buildFallbackEvaluation(summary);

      const overall = summary.overall ?? 0;
      const speaking = summary.speaking ?? 0;
      const writing = summary.writing ?? 0;
      const reading = summary.reading ?? 0;
      const listening = summary.listening ?? 0;



      return `
    <html>
    <head>
      <title>PTE Academic Score Report</title>
      <style>
        * { box-sizing: border-box; }
        body {
          font-family: Arial, sans-serif;

          width: 90px;

        }

        }

        }

          font-size: 18px;

          color: #111827;

        .candidate-grid {

        }
        .info-label {
          font-size: 11px;
          font-weight: bold;
          color: #1f3c88;
          text-transform: uppercase;
          margin-bottom: 6px;
          letter-spacing: 0.4px;
        }
        .info-value {
          font-size: 14px;

          word-break: break-word;
        }
        .score-summary {
          border: 1px solid #bfdbfe;

    function downloadPdfReport(exam) {
      const reportWindow = window.open("", "_blank");
      if (!reportWindow) {
        alert("Report window could not be opened. Please allow pop-ups and try again.");
        return;
      }

      const candidateName = String(exam.candidateName || "Candidate")
        .trim()
        .replace(/\s+/g, "_")
        .replace(/[^\p{L}\p{N}_-]/gu, "");

      const candidateSurname = String(exam.candidateSurname || "")
        .trim()
        .replace(/\s+/g, "_")
        .replace(/[^\p{L}\p{N}_-]/gu, "");

      const fullName = candidateSurname && !candidateName.endsWith(`_${candidateSurname}`)
        ? `${candidateName}_${candidateSurname}`
        : candidateName;

      const fileName = `PTE_ACADEMIC_SCORE_REPORT_${fullName}`;

      let html = buildPdfHtml(exam);

      html = html.replace(
        /<title>.*?<\/title>/i,
        `<title>${fileName}</title>`
      );

      reportWindow.document.open();
      reportWindow.document.write(html);
      reportWindow.document.close();

      setTimeout(() => {
        reportWindow.focus();
        reportWindow.print();
      }, 500);
    }

    async function deleteResult(resultId, candidateName, cardEl) {
      const ok = confirm(`${candidateName || "Bu adayın"} sonucunu silmek istiyor musunuz?`);
      if (!ok) return;

      try {
        const response = await fetch(`/exam-results/${resultId}`, {
          method: "DELETE",
          cache: "no-store"
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          showToast(data.error || "Aday sonucu silinemedi.", "error");
          return;
        }

        if (cardEl) {
          cardEl.remove();
        }

        showToast("Aday sonucu silindi.", "success");

      } catch (error) {
        console.error(error);
        showToast("Server connection error.", "error");
      }
    }

    function preserveScroll(callback) {
      const scrollY = window.scrollY;

      callback().then(() => {
        requestAnimationFrame(() => {
          window.scrollTo(0, scrollY);
        });
      });
    }

    function getFilteredAndSortedResults(data) {
      const search = document.getElementById("searchInput").value.toLowerCase();
      const sort = document.getElementById("sortSelect").value;

      let results = [...data];

      // filtre
      if (search) {
        results = results.filter(e =>
          (e.candidateName || "").toLowerCase().includes(search) ||
          (e.examCode || "").toLowerCase().includes(search)
        );
      }

      // sıralama
      if (sort === "newest") {
        results.sort((a, b) => new Date(b.finishedAt) - new Date(a.finishedAt));
      }

      if (sort === "oldest") {
        results.sort((a, b) => new Date(a.finishedAt) - new Date(b.finishedAt));
      }

      if (sort === "name_asc") {
        results.sort((a, b) => (a.candidateName || "").localeCompare(b.candidateName || ""));
      }

      if (sort === "name_desc") {
        results.sort((a, b) => (b.candidateName || "").localeCompare(a.candidateName || ""));
      }

      return results;
    }

      const isOpen = content.style.display !== "none";

      if (isOpen) {
        content.style.display = "none";
        button.textContent = button.textContent.replace("▼", "▶");
      } else {
        content.style.display = "block";
        button.textContent = button.textContent.replace("▶", "▼");
      }
    }

        Clear
      </button>
    </div>
  </div>
`;





              html += `</div>`;
            });

            // Question Review ana kapsayıcısını kapat
            html += `</div>`;
          }

          card.innerHTML = html;
          container.appendChild(card);

          const pdfBtn = card.querySelector(".btn-pdf");
          pdfBtn.addEventListener("click", () => downloadPdfReport(exam));

          const deleteBtn = card.querySelector(".btn-delete");
          deleteBtn.addEventListener("click", () =>
            deleteResult(exam.id || exam._id, exam.candidateName, card)
          );
        });
      } catch (error) {
        container.innerHTML = "<p class='empty'>Server connection error.</p>";
        console.error(error);
      }
    }

    document.getElementById("searchInput").addEventListener("input", loadResults);
    document.getElementById("sortSelect").addEventListener("change", loadResults);

    loadResults();

    async function updateManualScore(resultId, questionId, buttonEl) {
      const wrapper = buttonEl.parentElement;
      const input = wrapper.querySelector(".manual-score-input");
      const manualScore = input.value === "" ? null : Number(input.value);

      buttonEl.disabled = true;
      buttonEl.innerText = "Saving...";

      try {
        const response = await fetch(`/exam-results/${resultId}/manual-score`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            questionId,
            manualScore
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          alert(data.error || "Puan güncellenemedi.");
          buttonEl.innerText = "Save Score";
          buttonEl.disabled = false;
          return;
        }

        input.value = data.updatedAnswer.manualScore ?? "";

        const questionBox = wrapper.closest(".question");
        const scoreBox = questionBox.querySelector(".question-score");

        if (scoreBox) {
          scoreBox.innerHTML = `
        Auto: ${data.updatedAnswer.autoScore ?? 0} |
        Final: ${data.updatedAnswer.finalScore ?? data.updatedAnswer.autoScore ?? 0} / ${data.updatedAnswer.maxScore || 10}
      `;
        }

        buttonEl.innerText = "Saved";
        buttonEl.style.background = "#059669";

        setTimeout(async () => {
          buttonEl.innerText = "Save Score";
          buttonEl.style.background = "";
          buttonEl.disabled = false;

          const scrollY = window.scrollY;

          await loadResults();

          requestAnimationFrame(() => {
            window.scrollTo(0, scrollY);
          });
        }, 800);

      } catch (error) {
        console.error(error);
        alert("Server connection error.");
        buttonEl.innerText = "Save Score";
        buttonEl.disabled = false;
      }
    }
    async function clearManualScore(resultId, questionId) {
      const buttonEl = event.target;
      const wrapper = buttonEl.parentElement;
      const input = wrapper.querySelector(".manual-score-input");

      buttonEl.disabled = true;
      buttonEl.innerText = "Clearing...";

      try {
        const response = await fetch(`/exam-results/${resultId}/manual-score`, {
          method: "PUT",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            questionId,
            manualScore: null
          })
        });

        const data = await response.json();

        if (!response.ok || !data.success) {
          alert(data.error || "Manual score temizlenemedi.");
          buttonEl.innerText = "Clear";
          buttonEl.disabled = false;
          return;
        }

        input.value = "";

        const questionBox = wrapper.closest(".question");
        const scoreBox = questionBox.querySelector(".question-score");

        if (scoreBox) {
          scoreBox.innerHTML = `
        Auto: ${data.updatedAnswer.autoScore ?? 0} |
        Final: ${data.updatedAnswer.finalScore ?? data.updatedAnswer.autoScore ?? 0} / ${data.updatedAnswer.maxScore || 10}
      `;
        }

        buttonEl.innerText = "Cleared";
        buttonEl.style.background = "#059669";

        setTimeout(() => {
          buttonEl.innerText = "Clear";
          buttonEl.style.background = "#6b7280";
          buttonEl.disabled = false;
        }, 1200);

      } catch (error) {
        console.error(error);
        alert("Server connection error.");
        buttonEl.innerText = "Clear";
        buttonEl.disabled = false;
      }
    }
  </script>
